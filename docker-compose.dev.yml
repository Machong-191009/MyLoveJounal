# 开发环境 - 只启动 PostgreSQL 数据库
# 使用方式: docker compose -f docker-compose.dev.yml up -d

services:
  db:
    image: postgres:16-alpine
    container_name: love-journal-db
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: love_journal
      POSTGRES_USER: lover
      POSTGRES_PASSWORD: your_secure_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lover -d love_journal"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_dev_data:
